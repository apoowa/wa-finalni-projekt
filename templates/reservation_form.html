{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">Reservation: {{ movie.title }}</h2>
        <form method="POST" class="p-4 border rounded shadow-sm bg-white">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" id="email" required placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="ticket_type" class="form-label">Ticket Type</label>
                <select name="ticket_type" class="form-select" id="ticket_type">
                    {% for type in ticket_types %}
                    <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Seat Selection</label>
                <div class="p-4 border border-dashed text-center text-muted rounded bg-light">
                    <i class="bi bi-grid-3x3-gap"></i> [ Interactive Seat Map Coming Soon ]
                </div>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100">Confirm Reservation</button>
        </form>
    </div>
</div>
{% endblock %}
