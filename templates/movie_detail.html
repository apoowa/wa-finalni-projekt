{% extends "base.html" %}
{% block content %}
<div class="row mt-5">
    <div class="col-md-4">
        <img src="{{ url_for('static', filename='images/' + movie.image) }}" class="img-fluid rounded shadow" alt="{{ movie.title }}">
    </div>
    <div class="col-md-8">
        <h1 class="display-4 fw-bold">{{ movie.title }}</h1>
        <p class="fs-5 text-muted">{{ movie.description }}</p>
        <hr>
        <div class="mb-4">
            <p><strong>Director:</strong> {{ movie.director }}</p>
            <p><strong>Cast:</strong> {{ movie.cast }}</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('reservation', movie_id=movie.id) }}" class="btn btn-primary btn-lg px-4">Book Tickets</a>
            <a href="/" class="btn btn-outline-secondary btn-lg px-4">Back to List</a>
        </div>
    </div>
</div>
{% endblock %}
