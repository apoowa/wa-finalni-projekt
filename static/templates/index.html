{% extends "base.html" %}

{% block content %}

<h1 class="mb-4 text-center">Movies</h1>

<div class="row">
    {% for movie in movies %}
    <div class="col-md-4 mb-4">
        <div class="card movie-card shadow-sm h-100">
            <img src="{{ url_for('static', filename='images/' + movie.image) }}" 
                 class="card-img-top" 
                 alt="{{ movie.title }}">
            
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">
                    {{ movie.title }}
                </h5>
                <a href="/movie/{{ movie.id }}" class="btn btn-dark mt-auto">
                    Movie Detail
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
